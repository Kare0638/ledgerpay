spring:
  application:
    name: mock-psp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mockpsp}
    username: ${DB_USERNAME:ledgerpay}
    password: ${DB_PASSWORD:ledgerpay}
  jackson:
    # The PSP's wire format is snake_case, like the webhook fields in design §9.2.
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # Amounts are integer minor units: 10.99 must be a 400, not an operation for 10.
      accept-float-as-int: false
  task:
    scheduling:
      pool:
        size: 2   # settling and webhook delivery each get a thread

server:
  port: ${SERVER_PORT:8081}

mockpsp:
  settle-delay: ${PSP_SETTLE_DELAY:500ms}
  poll-interval: 200ms
  batch-size: 20
  webhook:
    url: ${PSP_WEBHOOK_URL:http://localhost:8080/webhooks/psp}
    secret: ${PSP_WEBHOOK_SECRET:dev-only-webhook-secret}
    connect-timeout: 2s
    read-timeout: 5s
    lease: 30s
    max-attempts: 20
  # Used only by faults injected through /_admin/faults, which exists under the dev profile only.
  faults:
    response-delay: 10s
    webhook-delay: 30s
    stale-event-delay: 1s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
