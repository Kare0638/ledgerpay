# The local stack's Prometheus (design §13, #22). Metrics are behind each service's ops key, so it
# scrapes with the local one. Intervals are short so the demo's breaks show within seconds.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials: dev-only-ops-key
    static_configs:
      - targets: ["payment-service:8080"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials: dev-only-ops-key
    static_configs:
      - targets: ["notification-service:8080"]
