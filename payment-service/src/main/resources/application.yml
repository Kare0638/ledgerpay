spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerpay}
    username: ${DB_USERNAME:ledgerpay}
    password: ${DB_PASSWORD:ledgerpay}
  jackson:
    deserialization:
      # Amounts are integer minor units: 10.99 must be a 400, not a payment for 10.
      accept-float-as-int: false
  task:
    scheduling:
      pool:
        # The PSP worker, the inbox processor and the outbox relay each get a thread: with
        # Spring's default of one, webhooks waited behind every batch of PSP calls.
        size: 3
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Design §10: acknowledged by every in-sync replica, and producer retries do not duplicate.
      acks: all
      properties:
        enable.idempotence: true
        # The relay holds its claimed rows until the broker answers, so a missing broker must fail
        # in seconds, not the client's default minute (max.block.ms) or two (delivery.timeout.ms).
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    admin:
      # Kafka is not needed to start: payments and the ledger work without it (design §10).
      fail-fast: false
      operation-timeout: 5s

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

server:
  port: ${SERVER_PORT:8080}

ledgerpay:
  psp:
    base-url: ${PSP_BASE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
    lease: 30s
    batch-size: 20
    poll-interval: 500ms
    safety-net-delay: 15m
    provider: mock-psp
    webhook-secret: ${PSP_WEBHOOK_SECRET:dev-only-webhook-secret}
    max-attempts: 10
    max-backoff: 60s
  inbox:
    poll-interval: 200ms
  outbox:
    topic: payments.events
    partitions: 6
    batch-size: 100
    poll-interval: 200ms
    publish-timeout: 15s
  ops:
    # Hex SHA-256 of the operations key for /ops/**; unset turns those endpoints off.
    api-key-hash: ${OPS_API_KEY_HASH:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
