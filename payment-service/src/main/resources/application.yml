spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerpay}
    username: ${DB_USERNAME:ledgerpay}
    password: ${DB_PASSWORD:ledgerpay}
  jackson:
    deserialization:
      # Amounts are integer minor units: 10.99 must be a 400, not a payment for 10.
      accept-float-as-int: false
  task:
    scheduling:
      pool:
        # The PSP worker and the inbox processor each get a thread: with Spring's default of one,
        # webhooks waited behind every batch of PSP calls.
        size: 2

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

server:
  port: ${SERVER_PORT:8080}

ledgerpay:
  psp:
    base-url: ${PSP_BASE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
    lease: 30s
    batch-size: 20
    poll-interval: 500ms
    safety-net-delay: 15m
    provider: mock-psp
    webhook-secret: ${PSP_WEBHOOK_SECRET:dev-only-webhook-secret}
    max-attempts: 10
    max-backoff: 60s
  inbox:
    poll-interval: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
