spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerpay}
    username: ${DB_USERNAME:ledgerpay}
    password: ${DB_PASSWORD:ledgerpay}
  jackson:
    deserialization:
      # Amounts are integer minor units: 10.99 must be a 400, not a payment for 10.
      accept-float-as-int: false
  task:
    scheduling:
      pool:
        # The PSP worker, the inbox processor, the outbox relay and the recon sweeper each get a
        # thread: with Spring's default of one, webhooks waited behind every batch of PSP calls.
        size: 4
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Design §10: acknowledged by every in-sync replica, and producer retries do not duplicate.
      acks: all
      properties:
        enable.idempotence: true
        # The relay holds its claimed rows until the broker answers, so a missing broker must fail
        # in seconds, not the client's default minute (max.block.ms) or two (delivery.timeout.ms).
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    admin:
      # Kafka is not needed to start: payments and the ledger work without it (design §10).
      fail-fast: false
      operation-timeout: 5s

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # A settlement upload over max-file-size is refused before its body is read. Tomcat then drains
    # the rest so the client can read the 413; past this much it resets the connection instead.
    # The 2MB default is less than the 10MB limit itself.
    max-swallow-size: 64MB

ledgerpay:
  psp:
    base-url: ${PSP_BASE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
    lease: 30s
    batch-size: 20
    poll-interval: 500ms
    safety-net-delay: 15m
    provider: mock-psp
    webhook-secret: ${PSP_WEBHOOK_SECRET:dev-only-webhook-secret}
    max-attempts: 10
    max-backoff: 60s
  inbox:
    poll-interval: 200ms
  outbox:
    topic: payments.events
    partitions: 6
    batch-size: 100
    poll-interval: 200ms
    publish-timeout: 15s
    # Refusals of one event for what it is (too large, not serialisable) before it is quarantined.
    max-rejections: 3
  recon:
    # A run still RUNNING this long is taken to have died with its process and marked FAILED.
    abandoned-after: 10m
    sweep-interval: 1m
  assistant:
    # The reconciliation assistant (#26) is off without a key. The key comes from the environment
    # or a file such as a Compose secret, never from this file (SECURITY.md).
    api-key: ${GEMINI_API_KEY:}
    api-key-file: ${GEMINI_API_KEY_FILE:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
  ops:
    # Hex SHA-256 of the operations key for /ops/**; unset turns those endpoints off.
    api-key-hash: ${OPS_API_KEY_HASH:}

management:
  metrics:
    tags:
      # Every series says which service it is from, for one dashboard over all of them.
      application: ${spring.application.name}
    distribution:
      # Request latency as a histogram, so Prometheus can take the p99 across instances (design §13).
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
