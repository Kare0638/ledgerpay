name: Benchmarks

# The M5 performance runs (design §14.1): the executor benchmark (#33) and the JFR recording under
# load (#34). Too slow for every push: run them by hand, or label a pull request run-benchmarks
# (JMH) or run-load-test (JFR under k6). Each report lands in its job summary.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  jmh:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerpay
          POSTGRES_PASSWORD: ledgerpay
          POSTGRES_DB: bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerpay -d bench"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build benchmarks
        run: ./mvnw -B -pl benchmarks -am package -DskipTests -Dspotless.check.skip=true

      - name: Run benchmarks
        run: benchmarks/run.sh
        env:
          LEDGERPAY_BENCH_JDBC_URL: jdbc:postgresql://localhost:5432/bench

      - name: Publish report
        run: cat benchmarks/target/results/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/target/results/*.md
            benchmarks/target/results/*.json
            benchmarks/target/results/*.txt

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-jfr
          path: |
            benchmarks/target/results/jfr
            benchmarks/target/results/jfr-http
          retention-days: 30

  # The JFR recording under k6 load (design §14.1, #34), on the full Compose stack.
  load-jfr:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-load-test'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # For the jfr tool used by the analysis; the services run in their own images.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Record payment-service under load
        run: load-tests/run-jfr.sh

      - name: Publish report
        run: cat load-tests/target/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-jfr
          path: load-tests/target
          retention-days: 30
