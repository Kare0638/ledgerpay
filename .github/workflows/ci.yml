name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests, Testcontainers integration tests (PostgreSQL, Kafka), acceptance tests against
      # the real mock-psp, the Spotless format check and the JaCoCo gate: a module below 80 % line
      # coverage fails the build (design §12). Properties without their own tries run 200 here
      # rather than jqwik's 1,000: the payment history property takes about 2.5 minutes at 1,000.
      - name: Build and verify
        run: ./mvnw -B verify -Djqwik.tries.default=200

      - name: Coverage summary
        if: always()
        # Also after a failed verify, when some modules have no report yet: nullglob skips them.
        run: |
          shopt -s nullglob
          {
            echo "| Module | Line coverage | Branch coverage |"
            echo "|---|---:|---:|"
            for csv in */target/site/jacoco/jacoco.csv; do
              awk -F, -v module="${csv%%/*}" '
                function pct(covered, missed) {
                  return covered + missed == 0 ? "n/a" : sprintf("%.1f %%", 100 * covered / (covered + missed))
                }
                NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
                END { printf "| %s | %s | %s |\n", module, pct(lc, lm), pct(bc, bm) }' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: "*/target/site/jacoco"
          retention-days: 14

  # A fresh checkout runs the happy path with one command (#16): the Compose stack from the
  # Dockerfile, then scripts/demo.sh's checks of the ledger, balance, Kafka events and webhooks.
  demo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run the demo
        run: scripts/demo.sh

      - name: Service logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail 200

  # The reconciliation story on a stack of its own (#21): a lost webhook found, fixed by inquiry,
  # and four report variants, each checked against demo/expected/.
  recon-demo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run the reconciliation demo
        run: demo/run.sh

      - name: Service logs
        if: failure()
        run: docker compose -p ledgerpay-recon-demo -f infra/docker-compose.yml logs --no-color --tail 200
